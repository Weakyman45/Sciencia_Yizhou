database:
  path: "data/reviews.db"
  schema_file: "schema.sql"

# Data sources configuration
sources:
  google_play:
    enabled: true
    # Single app approach (Reddit)
    app_id: "com.reddit.frontpage"
    app_name: "Reddit"
    target_reviews: 1000
    language: "en"
    country: "us"

  apple_app_store:
    enabled: true
    # Dynamic discovery approach
    target_reviews: 2000
    countries:
      - "us"
    search_terms:
      - "game"
      - "music"
      - "photo"
      - "fitness"
      - "calendar"
      - "ai"
      - "chat"
      - "learn"
      - "finance"
      - "weather"
      - "maps"
      - "camera"
      - "notes"
      - "video"
      - "shopping"
      - "travel"
      - "food"
      - "health"
      - "sleep"
      - "scanner"
      - "budget"
      - "vpn"
    search_limit: 200
    max_pages_per_app: 10

pipeline:
  batch_size: 100
  min_delay_between_search_calls: 3.5 # Apple search API
  min_delay_between_rss_calls: 0.4 # Apple RSS feeds
  retry_attempts: 3
  retry_delay_seconds: 5

# Resume settings (for Apple's incremental collection)
resume:
  enabled: true
  seen_keys_file: "data/apple_seen_keys.txt"

# Logging configuration
logging:
  level: "INFO"
  file: "logs/pipeline.log"

schedule:
  # Current frequency setting
  frequency: "every_4_hours" # Options: daily, every_6_hours, every_4_hours, every_2_hours, hourly

  # Cron expressions for each frequency (for reference)
  # daily:        "0 2 * * *"       (2:00 AM UTC)
  # every_6_hours: "0 */6 * * *"    (00:00, 06:00, 12:00, 18:00 UTC)
  # every_4_hours: "0 */4 * * *"    (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  # every_2_hours: "0 */2 * * *"    (every even hour)
  # hourly:       "0 * * * *"       (every hour)

monitoring:
  enabled: true

  alerts:
    # Alert if new records drop below this % of recent average
    min_records_pct: 50

    # Alert if runtime exceeds this multiple of recent average
    max_duration_multiplier: 2.0

    # Alert if error rate exceeds this percentage
    max_error_rate_pct: 5

    # Alert if rating distribution shifts by more than this (percentage points)
    rating_drift_threshold_pct: 10

  # Report settings
  report:
    generate_after_run: true
    output_file: "logs/monitoring_report.txt"

# Output files (intermediate, before DB load)
output:
  google_play_json: "data/google_play_reviews.json"
  apple_jsonl: "data/apple_reviews.jsonl"
