# Default: every 4 hours. Adjust the cron expression to test different intervals.
#
# Frequency options:
#   - Daily:        cron: '0 2 * * *'
#   - Every 6 hours: cron: '0 */6 * * *'
#   - Every 4 hours: cron: '0 */4 * * *'  (CURRENT)
#   - Every 2 hours: cron: '0 */2 * * *'
#   - Hourly:       cron: '0 * * * *'
# =============================================================================

name: Data Ingestion Pipeline

on:
  # Scheduled run - currently set to every 4 hours
  schedule:
    - cron: "0 */4 * * *"

  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no database changes)"
        required: false
        default: "false"
        type: boolean
      google_only:
        description: "Fetch Google Play only (faster)"
        required: false
        default: "false"
        type: boolean
      apple_only:
        description: "Fetch Apple App Store only"
        required: false
        default: "false"
        type: boolean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Reduced since per-run targets are smaller now

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p data logs

      - name: Run pipeline
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.google_only }}" == "true" ]; then
            ARGS="$ARGS --google-only"
          fi
          if [ "${{ github.event.inputs.apple_only }}" == "true" ]; then
            ARGS="$ARGS --apple-only"
          fi
          python run_pipeline.py $ARGS

      - name: Display monitoring report
        if: success()
        run: |
          echo "=== MONITORING REPORT ==="
          python run_pipeline.py --report || true

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14

      - name: Upload database as artifact
        if: success() && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-${{ github.run_number }}
          path: data/reviews.db
          retention-days: 7

      - name: Commit database changes
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/reviews.db data/apple_seen_keys.txt logs/monitoring_report.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Pipeline run: $(date -u +%Y-%m-%d_%H:%M:%S) [auto]"
            git push
          fi
